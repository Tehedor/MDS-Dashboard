# Datasets/clean_pipelines.yml
clean_functions:


  # ============================================================
  # FUNCIÓN 1 — Asignar timestamp como índice
  # ============================================================
  - assign_timestamp_index:
      module: "utils.clean_functions._1_assign_timestamp"
      func: "assign_timestamp_index"
      description: "Convertir columna timestamp a datetime y establecerla como índice"

  # ============================================================
  # FUNCIÓN 2 — SOLO PARA EventEncodedDataSet
  # Convierte (Timestamp, event) → columnas por evento + arrays agregados
  # ============================================================
  - expand_event_codes:
      module: "utils.clean_functions._2_expand_event_codes"
      func: "expand_event_codes"
      description: "Expandir eventos del diccionario en columnas individuales y agregados"

