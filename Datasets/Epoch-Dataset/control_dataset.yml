# /Datasets/Epoch-Dataset/control_dataset.yml
metadata:
  version: "1.0"
  dataset: "MDS Microgrid Dataset"
  description: "Configuración de componentes y medidas de la microgrid"
  date_created: "2025-11-05"
  type: EventEncodedDataSet
  dictionary: "Events_Dictionary.json"
  components: "control_groupedDictionary.yml"
  

pipelineCleanData:
  run_enabled: true

  available_functions:
    - merge_all_datasets:
        enabled: true
        module: "utils.clean_functions._0_merge_datasets"
        func: "merge_all_datasets"
        description: "Cargar CSV de eventos"

    - event_convert_timestamp:
        enabled: true
        module: "utils.clean_functions._9_event_convert_timestamp"
        func: "event_convert_timestamp"
        description: "Convertir timestamp a datetime para eventos"
