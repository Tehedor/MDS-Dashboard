# /Datasets/MDS-Dataset/control_dataset.yml
metadata:
  version: "1.0"
  dataset: "MDS Microgrid Dataset"
  description: "Configuración de componentes y medidas de la microgrid"
  date_created: "2025-11-05"
  type: TabularDataSet
  timestamp_col: Timestamp

pipelineCleanData:
  run_enabled: true
  available_functions:
    - assign_timestamp_index: true
    - clean_and_unify_duplicates: true
    - negative_freq_report: true
    - rellenar_timestamps: true
    # - normalize_timestamp_column: true

components:  
  
  MG_Bus:
  - MG-LV-MSB_AC_Voltage
  - MG-LV-MSB_Frequency

  Battery:
  - Battery_Active_Power
  - Battery_Active_Power
  - Battery_Active_Power_Set_Response

  GE_Gas_Engine:
  - GE_Active_Power
  - GE_Body_Active_Power
  - GE_Body_Active_Power_Set_Response
  
  FC_Fuel_Cell:
  - FC_Active_Power
  - FC_Active_Power_FC_END_Set
  - FC_Active_Power_FC_end_Set_Response
  
  PVPCS_Photovoltaic:
  - PVPCS_Active_Power

  Receiving_Point:
  - Receiving_Point_AC_Voltage

  Thermal_System:
  - Inlet_Temperature_of_Chilled_Water
  - Outlet_Temperature
  
  Island_Mode:
  - Island_mode_MCCB_Active_Power
  - Island_mode_MCCB_AC_Voltage
  - Island_mode_MCCB_Frequency